name: signals

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    paths:
      - "scripts/probe.py"   # re-runs automatically when the script changes

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe and archive feeds
        run: python scripts/probe.py

      - name: Commit data
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily snapshot $(date -u +%F)"
          git pull --rebase origin main
          git push
