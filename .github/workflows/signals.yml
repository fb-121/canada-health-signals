name: signals

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    paths:
      - "scripts/**"         # re-runs automatically when the scripts change

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe and archive feeds
        run: python scripts/probe.py

      - name: Collect AI evidence counts and FDA list
        continue-on-error: true
        run: python scripts/ai_evidence.py

      - name: "Briefing: fixture unit tests (no network)"
        continue-on-error: true
        run: python scripts/run_tests.py

      - name: "Briefing: Rules (FDA AI clearances)"
        continue-on-error: true
        run: python scripts/briefing_rules.py

      - name: "Briefing: install PDF reader"
        continue-on-error: true
        run: pip install --quiet pypdf

      - name: "Briefing: diagnose FDA document access"
        continue-on-error: true
        run: python scripts/fda_probe.py K261679

      - name: "Briefing: read FDA 510(k) summaries"
        continue-on-error: true
        run: python scripts/briefing_docs.py

      - name: "Briefing: Money (SEC Form D health raises)"
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/briefing_money.py

      - name: "Briefing: build the page"
        continue-on-error: true
        run: python scripts/build_briefing.py

      - name: Build the page
        continue-on-error: true   # a page problem must never lose the day's data
        run: python scripts/build_site.py

      - name: Build the AI page
        continue-on-error: true
        run: python scripts/build_ai.py

      - name: Commit data and page
        if: always()
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "data: daily snapshot $(date -u +%F)"
          git pull --rebase origin main
          git push

  verify-live:
    # Live integration check. Unit tests passing and the data job going green do not show that the
    # public files are current. This fails when a public copy still carries an older build.
    needs: probe
    if: always() && needs.probe.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the public files with the build
        run: python scripts/verify_live.py
